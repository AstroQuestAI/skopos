apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: call-assistant-api
  namespace: call-assistant
spec:
  ingressClassName: nginx
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: call-assistant-api
                port:
                  number: 8000
