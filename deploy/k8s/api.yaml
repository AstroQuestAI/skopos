apiVersion: v1
kind: Service
metadata:
  name: call-assistant-api
  namespace: call-assistant
spec:
  type: ClusterIP
  selector:
    app: call-assistant-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: call-assistant-api
  namespace: call-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: call-assistant-api
  template:
    metadata:
      labels:
        app: call-assistant-api
    spec:
      containers:
        - name: api
          image: call-assistant-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: call-assistant-config
            - secretRef:
                name: call-assistant-secrets
          env:
            - name: MONGODB_URI
              value: "mongodb://mongo:27017"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
