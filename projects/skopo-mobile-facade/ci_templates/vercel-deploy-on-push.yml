name: Trigger Vercel deploy on push to main

# Fires the Vercel Deploy Hook whenever anyone pushes to `main`.
# This bypasses GitHub ↔ Vercel webhook drift that caused v7.5 to lag.
#
# The hook URL itself is a write-only deploy trigger (not a secret that
# can read anything), but we still store it as a GitHub Actions Secret
# named VERCEL_DEPLOY_HOOK_URL for good hygiene.
#
# Setup (one-time):
#   GitHub repo → Settings → Secrets and variables → Actions → New repo secret
#     Name:  VERCEL_DEPLOY_HOOK_URL
#     Value: https://api.vercel.com/v1/integrations/deploy/prj_K3eGtwQFyPn7lxa0pQ7mVP3D36sI/pIgVnSq9Sz

on:
  push:
    branches:
      - main

jobs:
  trigger-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Fire Vercel Deploy Hook
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL secret is not set — skipping"
            exit 0
          fi
          echo "::notice::Triggering Vercel deploy for commit ${GITHUB_SHA:0:7}"
          response=$(curl -sS -o /tmp/vercel_resp.json -w "%{http_code}" -X POST "$HOOK_URL")
          cat /tmp/vercel_resp.json
          echo ""
          if [ "$response" != "200" ] && [ "$response" != "201" ]; then
            echo "::error::Vercel responded with HTTP $response"
            exit 1
          fi
          echo "::notice::Deploy successfully queued — check Vercel Deployments tab"
